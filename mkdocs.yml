# The documentation site (https://carlxsmg.github.io/UEAgent/), built from docs/ by
# .github/workflows/docs.yml with Material for MkDocs. Tools/mkdocs_hooks.py adds what the site has
# and the Markdown on GitHub does not: includes, tabs, tool links, the domains in the navigation,
# the tool explorer's data and llms.txt.
site_name: UEAgent
site_description: The MCP server for Unreal Engine 5, built into the editor.
site_url: https://carlxsmg.github.io/UEAgent/
repo_url: https://github.com/CarlxsMG/UEAgent
repo_name: CarlxsMG/UEAgent
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 CarlxsMG. Released under the MIT License.

theme:
  name: material
  custom_dir: docs/.overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.action.edit

hooks:
  - Tools/mkdocs_hooks.py

# Files the hooks read, so that `mkdocs serve` rebuilds when they change.
watch:
  - README.md
  - CHANGELOG.md
  - CONTRIBUTING.md
  - SECURITY.md
  - Resources/command_catalog.json
  - Tools/mkdocs_hooks.py

plugins:
  - search

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/explorer.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CarlxsMG/UEAgent
      name: UEAgent on GitHub

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# The hooks expand `Tool reference` into a section with one page per domain.
nav:
  - Home: index.md
  - Get started:
      - Getting started: getting-started.md
      - Clients: clients.md
      - Choosing a server: choosing.md
  - Use:
      - Examples: examples.md
      - Skills: skills.md
  - Reference:
      - Tool explorer: explorer.md
      - Answers and refusals: responses.md
      - Settings: settings.md
      - Glossary: glossary.md
      - Tool reference: tools/README.md
  - Help:
      - FAQ: faq.md
      - Troubleshooting: troubleshooting.md
      - Ask in Discussions: https://github.com/CarlxsMG/UEAgent/discussions/categories/q-a
      - Report an issue: https://github.com/CarlxsMG/UEAgent/issues/new/choose
  - Project:
      - Architecture: architecture.md
      - Security and privacy: security.md
      - Accessibility: accessibility.md
      - Changelog: changelog.md
      - Contributing: contributing.md
      - Migrating to 2.0: migrating-to-2.0.md
