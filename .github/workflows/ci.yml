name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  generated:
    name: Generated files follow the C++
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Property handlers
        run: |
          python Tools/integrate_property_handlers.py
          git diff --exit-code
      - name: Tool catalog
        run: python Tools/codegen_command_catalog.py --check
      - name: Known-param table
        run: python Tools/codegen_param_table.py --check
      - name: Param aliases
        run: python Tools/codegen_param_aliases.py --check
      - name: PIE-safety table
        run: python Tools/codegen_pie_safety.py --check
      - name: Tool reference
        run: python Tools/codegen_tool_docs.py --check

  docs:
    name: Documentation links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Relative links and anchors
        run: python Tools/check_doc_links.py

  lint:
    name: Python tools lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: ruff
        run: |
          pip install ruff==0.14.11
          ruff check Tools
