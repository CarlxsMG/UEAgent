name: MCP Registry

# Publishes server.json to the official MCP Registry (https://registry.modelcontextprotocol.io) when
# a release is published, under that release's version. The registry holds only the listing:
# UEAgent installs from the release archives, so server.json names no package. A version is
# published once; to change the listing, publish it with the next release.

on:
  release:
    types: [published]
  # Publishes the latest release, for a first listing or one a failed run left out.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to the MCP Registry
    # The listing's namespace (io.github.CarlxsMG) comes from this repository's OIDC token.
    if: github.repository == 'CarlxsMG/UEAgent' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: mcp-publisher
        env:
          VERSION: 1.8.1
          SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSLo mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v$VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Version of the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="${TAG:-$(gh release view --json tagName --jq .tagName)}"
          jq --arg v "${tag#v}" '.version = $v' server.json > server.tmp && mv server.tmp server.json
          jq -r '"\(.name) \(.version)"' server.json
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
