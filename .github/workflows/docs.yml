name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Documentation site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Material for MkDocs
        run: pip install mkdocs-material==9.7.7
      - name: Build (warnings fail it)
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        if: github.repository == 'CarlxsMG/UEAgent' && github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    # Only the public repository has a GitHub Pages site; elsewhere the build is the check.
    if: github.repository == 'CarlxsMG/UEAgent' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
